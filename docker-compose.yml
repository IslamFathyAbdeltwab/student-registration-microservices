version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"

  studentservice:
    build:
      context: ./StudentService
    container_name: studentservice
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=StudentServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
    depends_on:
      - sqlserver

  courseservice:
    build:
      context: ./CourseService
    container_name: courseservice
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=CourseServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
    depends_on:
      - sqlserver

  enrollmentservice:
    build:
      context: ./EnrollmentService
    container_name: enrollmentservice
    ports:
      - "5003:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=EnrollmentServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      Services__StudentService: "http://studentservice:8080"
      Services__CourseService: "http://courseservice:8080"
    depends_on:
      - sqlserver
      - studentservice
      - courseservice

  apigateway:
    build:
      context: ./ApiGateway
    container_name: apigateway
    ports:
      - "5000:8080"
    depends_on:
      - studentservice
      - courseservice
      - enrollmentservice