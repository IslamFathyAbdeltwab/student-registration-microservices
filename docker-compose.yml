version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong@Passw0rd\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  studentservice1:
    build:
      context: ./StudentService
    container_name: studentservice1
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=StudentServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  studentservice2:
    build:
      context: ./StudentService
    container_name: studentservice2
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=StudentServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  courseservice:
    build:
      context: ./CourseService
    container_name: courseservice
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=CourseServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  enrollmentservice:
    build:
      context: ./EnrollmentService
    container_name: enrollmentservice
    ports:
      - "5003:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=EnrollmentServiceDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      Services__StudentService: "http://apigateway:8080/students"
      Services__CourseService: "http://apigateway:8080/courses"
    depends_on:
      sqlserver:
        condition: service_healthy
      studentservice1:
        condition: service_started
      studentservice2:
        condition: service_started
      courseservice:
        condition: service_started

  apigateway:
    build:
      context: ./ApiGateway
    container_name: apigateway
    ports:
      - "5000:8080"
    depends_on:
      - studentservice1
      - studentservice2
      - courseservice
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
  notificationservice:
    build:
      context: ./NotificationService
    container_name: notificationservice
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
